server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10m;

    # always: also emit these on error responses, not just 2xx/3xx.
    # nosniff matters most for /storage/favicons/*, which is third-party image
    # data fetched from monitored sites and served back from our own origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is deliberately not set here: TLS terminates at the reverse proxy,
    # which owns that header and knows whether the domain is HTTPS-only.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite emits content-hashed filenames, so build assets can be cached hard.
    # A single explicit Cache-Control rather than `expires`, which would set its
    # own and leave the response carrying the header twice.
    location ^~ /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        # Static assets are where compression pays (the stylesheet is ~240 kB
        # raw, ~32 kB gzipped). Application HTML is small by comparison and it
        # is the one response that carries a CSRF token next to reflected user
        # input, which is the shape BREACH needs, so it is served uncompressed.
        # nginx always gzips text/html when gzip is on, so it has to be off here.
        gzip off;

        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
