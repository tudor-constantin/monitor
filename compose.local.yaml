services:
  app:
    depends_on:
      mailpit:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8080"

  mysql:
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  phpmyadmin:
    image: phpmyadmin:5.2.3
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
